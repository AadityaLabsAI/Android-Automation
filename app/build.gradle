plugins { id 'com.android.application' }

android {
    namespace 'com.aadityalabs.needle2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aadityalabs.needle2'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Needle 2 runtime is shipped as an ARM64 static library.
        // Keep the APK ARM64-only without combining ndk abiFilters and ABI splits.
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -ffunction-sections -fdata-sections'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    buildFeatures { buildConfig true }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    androidResources {
        noCompress += ['cact']
    }

    packaging {
        jniLibs { useLegacyPackaging false }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

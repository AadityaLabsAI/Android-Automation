name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Fetch pinned Needle 2
        run: bash scripts/fetch-needle.sh
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify
        run: |
          ls -lh app/build/outputs/apk/release/
          aapt dump badging app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -20
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: needle2-android9-arm64
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 30

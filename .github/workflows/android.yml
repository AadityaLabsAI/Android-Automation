name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Fetch pinned Needle 2 runtime
        run: bash scripts/fetch-needle.sh
      - name: Validate source tree
        run: |
          test -s app/src/main/cpp/third_party/libneedle.a
          test -s app/src/main/cpp/third_party/needle.h
          test -s app/src/main/assets/needle2.cact
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -Eq "^package: name=['\"]?com\.aadityalabs\.needle2['\"]?" /tmp/badging.txt
          grep -Eq "^sdkVersion:['\"]?28['\"]?" /tmp/badging.txt
          grep -Eq "^targetSdkVersion:['\"]?35['\"]?" /tmp/badging.txt

          command -v unzip >/dev/null
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libneedle2_jni.so'
          unzip -Z1 "$APK" | grep -Fx 'assets/needle2.cact'

          "$AAPT2" dump permissions "$APK" > /tmp/permissions.txt
          cat /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then
            echo "ERROR: INTERNET permission must not be present"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: needle2-android9-arm64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
